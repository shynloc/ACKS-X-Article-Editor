<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#eef3ec"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#173222" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#285e45"/>
    </marker>
    <style>
      .sans { font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
      .title { font-size: 44px; font-weight: 700; fill: #232724; }
      .subtitle { font-size: 22px; fill: #6f776f; }
      .card-title { font-size: 27px; font-weight: 700; fill: #234f3b; }
      .label { font-size: 20px; fill: #3e4640; }
      .small { font-size: 17px; fill: #737b74; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <g class="sans">
    <text class="title" x="90" y="92">ACKS X Article Editor · 发布架构</text>
    <text class="subtitle" x="90" y="132">本地写作真源，结构化转换，受控连接 X</text>

    <g filter="url(#shadow)">
      <rect x="90" y="220" width="390" height="420" rx="28" fill="#ffffff" stroke="#dce3da"/>
      <rect x="605" y="220" width="390" height="420" rx="28" fill="#ffffff" stroke="#dce3da"/>
      <rect x="1120" y="220" width="390" height="420" rx="28" fill="#ffffff" stroke="#dce3da"/>
    </g>

    <circle cx="155" cy="292" r="34" fill="#e6eee7"/>
    <path d="M137 278h36M137 292h25M137 306h31" stroke="#285e45" stroke-width="6" stroke-linecap="round"/>
    <text class="card-title" x="210" y="300">本地写作台</text>
    <text class="label" x="130" y="370">Markdown + CodeMirror</text>
    <text class="label" x="130" y="418">IndexedDB 自动保存</text>
    <text class="label" x="130" y="466">图片、历史、资源包</text>
    <rect x="130" y="520" width="310" height="76" rx="14" fill="#f4f1e8"/>
    <text class="small" x="155" y="551">默认不上传稿件</text>
    <text class="small" x="155" y="578">浏览器是写作真源</text>

    <circle cx="670" cy="292" r="34" fill="#e6eee7"/>
    <path d="M651 292h38M678 276l16 16-16 16" fill="none" stroke="#285e45" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="card-title" x="725" y="300">转换与校验</text>
    <text class="label" x="645" y="370">Markdown AST</text>
    <text class="label" x="645" y="418">X Content State</text>
    <text class="label" x="645" y="466">表格 / 代码 → PNG</text>
    <rect x="645" y="520" width="310" height="76" rx="14" fill="#eef3ec"/>
    <text class="small" x="670" y="551">提前看见降级</text>
    <text class="small" x="670" y="578">可定位、可回退、可备份</text>

    <circle cx="1185" cy="292" r="34" fill="#e6eee7"/>
    <path d="M1168 307l34-34M1176 273h26v26" fill="none" stroke="#285e45" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="card-title" x="1240" y="300">X 发布桥</text>
    <text class="label" x="1160" y="370">OAuth 2.0 PKCE</text>
    <text class="label" x="1160" y="418">Media Upload</text>
    <text class="label" x="1160" y="466">Draft → Publish</text>
    <rect x="1160" y="520" width="310" height="76" rx="14" fill="#e8efe9"/>
    <text class="small" x="1185" y="551">先建草稿，再确认发布</text>
    <text class="small" x="1185" y="578">令牌加密，不进浏览器</text>

    <path d="M500 430H575" stroke="#285e45" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M1015 430H1090" stroke="#285e45" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

    <rect x="250" y="720" width="1100" height="90" rx="22" fill="#285e45"/>
    <text x="800" y="758" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">本地写作 + X 格式转换 + 受控发布桥</text>
    <text x="800" y="790" text-anchor="middle" font-size="18" fill="#dceadf">手动发布无需登录 · 自动发布使用部署者自己的 Client ID 与 callback</text>
  </g>
</svg>
